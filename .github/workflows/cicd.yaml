name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['spec/v*', 'mcp/v*', 'validate/v*']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Validate protocol schemas
        run: node scripts/validate-schemas.mjs

      - name: Validate example payloads
        run: node scripts/validate-examples.mjs

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get git tag
        id: git_tag
        run: echo "tag=$(git describe --tags --always)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci
        working-directory: ./website

      - name: Copy protocol artifacts to static
        run: node scripts/copy-protocol.mjs
        working-directory: ./website

      - name: Build SvelteKit site
        run: npm run build
        working-directory: ./website
        env:
          VITE_GIT_TAG: ${{ steps.git_tag.outputs.tag }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: website/build/

  # Every spec/v* tag gets a GitHub Release — this job is the single owner of release
  # creation (release.sh no longer creates releases). Notes come from the committed
  # RELEASE_NOTES/vX.Y.Z.md at the tagged commit; auto-generated commit notes are the
  # fallback so a manually-pushed tag still gets a release rather than becoming an orphan.
  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/spec/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"          # spec/vX.Y.Z
          VERSION_TAG="${TAG#spec/}"        # vX.Y.Z
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for $TAG already exists — nothing to do."
            exit 0
          fi
          PRERELEASE_FLAG=""
          if git for-each-ref "refs/tags/$TAG" --format='%(contents)' | grep -qi 'pre-release'; then
            PRERELEASE_FLAG="--prerelease"
          fi
          NOTES_FILE="RELEASE_NOTES/${VERSION_TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" --title "BEST $VERSION_TAG" --notes-file "$NOTES_FILE" $PRERELEASE_FLAG
          else
            echo "::warning::$NOTES_FILE not found at the tagged commit — falling back to auto-generated notes."
            gh release create "$TAG" --title "BEST $VERSION_TAG" --generate-notes $PRERELEASE_FLAG
          fi

  docker-publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/spec/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          REPO_OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/${REPO_OWNER_LC}/spec:${{ github.sha }}
          docker build \
            --build-arg VITE_GIT_TAG=$(git describe --tags --always) \
            -t $IMAGE .
          docker push $IMAGE

      - name: Set image tag output
        id: image_tag
        run: |
          REPO_OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/${REPO_OWNER_LC}/spec:${{ github.sha }}" >> $GITHUB_OUTPUT

  npm-publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mcp/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        working-directory: ./mcp-server

      - name: Build
        run: npm run build
        working-directory: ./mcp-server

      - name: Publish to npm
        run: npm publish --access public
        working-directory: ./mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  npm-publish-validate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/validate/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        working-directory: ./validate-cli

      - name: Build
        run: npm run build
        working-directory: ./validate-cli

      - name: Publish to npm
        run: npm publish --access public
        working-directory: ./validate-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-iac:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/spec/v')
    needs: docker-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IaC repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.IAC_REPO }}
          token: ${{ secrets.IAC_PAT }}
          ref: ${{ secrets.IAC_BRANCH }}

      - name: Update image tag in deployment
        run: |
          REPO_OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          DEPLOY_FILE="${{ secrets.IAC_DEPLOY_PATH }}/deployment.yaml"
          sed -i 's|^\([[:space:]]*\)image:.*|\1image: ghcr.io/'"$REPO_OWNER_LC"'/spec:'"${{ github.sha }}"'|g' "$DEPLOY_FILE"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.IAC_PAT }}
          commit-message: "Update BEST website image to ${{ github.ref_name }} (${{ github.sha }})"
          branch: update-BEST-website-${{ github.ref_name }}
          base: ${{ secrets.IAC_BRANCH }}
          title: "Update BEST website image to ${{ github.ref_name }}"
          body: "Automated update of BEST website image tag to ${{ github.ref_name }} (commit ${{ github.sha }})."
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          signoff: true